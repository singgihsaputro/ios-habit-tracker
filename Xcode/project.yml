name: HabitTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  HabitTrackerApp:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/HabitTracker
        excludes: ["Resources/**"]
      - path: ../Sources/HabitTracker/Resources/habits.json
        buildPhase: resources
      - ../App
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.HabitTracker
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
